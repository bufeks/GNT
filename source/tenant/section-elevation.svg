<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 660" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- ===== BIGI 青葉台 1F 貸店舗区画 ／ A–A 断面（空間の立ち上げ・概略） ===== -->
  <!-- scale 1px = 10mm (≒1:100) ／ datum 1FL = y520, y(world)=520 - world*0.1 -->
  <rect x="0" y="0" width="1900" height="660" fill="#FAF9F6"/>

  <!-- title -->
  <text x="90" y="46" font-size="22" font-weight="700" fill="#1F1D1A">A–A 断面 ／ 空間の立ち上げ（概略）</text>
  <text x="90" y="68" font-size="12.5" fill="#6B6660">BIGI青葉台 1F 貸店舗区画 31.67㎡ / 9.58坪　CH=2,740　｜　実施図面 2026.05.14（イルミナ一級建築士事務所）より作図　｜　1:100 概略・要現場確認</text>

  <!-- ground / 地盤・床下ポシェ -->
  <rect x="60" y="525" width="1760" height="80" fill="#ECE8DF"/>
  <line x1="60" y1="525" x2="1820" y2="525" stroke="#C5C0B2" stroke-width="1"/>

  <!-- ===== 2FL slab (上階スラブ) over store/lounge/booth ===== -->
  <rect x="290" y="222" width="1470" height="17" fill="#D9D4C8"/>
  <line x1="290" y1="239" x2="1760" y2="239" stroke="#9C968A" stroke-width="1.5"/>
  <text x="300" y="234" font-size="11" fill="#6B6660">▽ 2FL スラブ下端（耐火被覆 大梁・スチールフレーム）</text>

  <!-- 軒 / terrace canopy (CH=2300) -->
  <line x1="90" y1="295" x2="290" y2="295" stroke="#7C4F2A" stroke-width="3"/>
  <text x="95" y="288" font-size="11" fill="#7C4F2A">軒ライン（CH=2,300）</text>

  <!-- ===== walls / 区画境界の躯体壁 ===== -->
  <!-- store front wall to terrace (大開口) X3 -->
  <line x1="290" y1="239" x2="290" y2="513" stroke="#1F1D1A" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- store/lounge X2 -->
  <line x1="1040" y1="239" x2="1040" y2="507" stroke="#1F1D1A" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- lounge/booth X1 -->
  <line x1="1630" y1="239" x2="1630" y2="504" stroke="#1F1D1A" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- rear building wall -->
  <rect x="1760" y="222" width="14" height="303" fill="#B8B3AA"/>

  <!-- ===== floors / 床レベル ===== -->
  <!-- terrace FL-50 -->
  <rect x="90" y="525" width="200" height="6" fill="#8A5A32"/>
  <line x1="90" y1="525" x2="290" y2="525" stroke="#5A3A1E" stroke-width="2"/>
  <!-- step riser terrace(-50)->store(+67) = 117mm -->
  <line x1="290" y1="525" x2="290" y2="513" stroke="#5A3A1E" stroke-width="2"/>
  <!-- store FL+67 -->
  <rect x="290" y="513" width="750" height="6" fill="#8A5A32"/>
  <line x1="290" y1="513" x2="1040" y2="513" stroke="#5A3A1E" stroke-width="2"/>
  <!-- lounge ramp FL+67 -> FL+164 (over 5900) -->
  <polygon points="1040,513 1630,504 1630,510 1040,519" fill="#8A5A32"/>
  <line x1="1040" y1="513" x2="1630" y2="504" stroke="#5A3A1E" stroke-width="2"/>
  <!-- booth FL+164 -->
  <rect x="1630" y="504" width="130" height="6" fill="#8A5A32"/>
  <line x1="1630" y1="504" x2="1760" y2="504" stroke="#5A3A1E" stroke-width="2"/>

  <!-- ===== level tags ===== -->
  <g font-size="11" fill="#2A4434">
    <text x="150" y="545">▽ FL-50（テラス）</text>
    <text x="560" y="535">▽ FL+67（店舗）</text>
    <text x="1300" y="497">▽ FL+164（ブース）</text>
  </g>

  <!-- CH dims (store) -->
  <g stroke="#6B6660" stroke-width="0.8">
    <line x1="640" y1="239" x2="640" y2="513"/>
    <line x1="636" y1="239" x2="644" y2="239"/>
    <line x1="636" y1="513" x2="644" y2="513"/>
  </g>
  <text x="650" y="380" font-size="12" fill="#2A2A2A">CH=2,740</text>

  <!-- ===== zone labels ===== -->
  <g font-size="13" fill="#1F1D1A">
    <text x="120" y="430" font-weight="600">テラス</text>
    <text x="120" y="448" font-size="11" fill="#6B6660">16.96㎡ / 5.13坪</text>

    <text x="600" y="300" font-weight="700" font-size="16">1F 貸店舗区画</text>
    <text x="600" y="322" font-size="12" fill="#6B6660">31.67㎡ / 9.58坪　CH=2,740</text>

    <text x="1180" y="300" font-weight="600">共用ラウンジ</text>
    <text x="1180" y="318" font-size="11" fill="#6B6660">FL+67〜164</text>

    <text x="1650" y="300" font-weight="600" transform="rotate(90 1650 300)">2名ブース</text>
  </g>

  <!-- rear note -->
  <text x="1770" y="360" font-size="12" fill="#2A4434" transform="rotate(90 1770 360)">→ 奥：共用廊下・会議室・ユニバーサルトイレ</text>

  <!-- ===== accessibility spine ===== -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2A4434"/>
    </marker>
  </defs>
  <path d="M120,500 L280,500 L300,489 L1030,489 L1620,480 L1745,480" fill="none" stroke="#2A4434" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow)" opacity="0.85"/>
  <text x="120" y="487" font-size="11.5" fill="#2A4434" font-weight="600">アクセシブルな背骨（前面テラス → 店舗 → 奥の共用部）</text>

  <!-- step / ramp callouts -->
  <g font-size="10.5" fill="#B06A00">
    <circle cx="290" cy="519" r="4" fill="none" stroke="#B06A00" stroke-width="1.5"/>
    <text x="298" y="560" fill="#B06A00">段差 117mm（FL-50→+67）<tspan x="298" dy="13">→ スロープ要</tspan></text>
    <circle cx="1335" cy="508" r="4" fill="none" stroke="#B06A00" stroke-width="1.5"/>
    <text x="1150" y="560" fill="#B06A00">ラウンジへ +97mm の傾斜<tspan x="1150" dy="13">→ 緩勾配スロープで吸収</tspan></text>
  </g>

  <!-- ===== grid & dimension chain ===== -->
  <g stroke="#1F1D1A" stroke-width="0.8">
    <line x1="290" y1="513" x2="290" y2="622"/>
    <line x1="1040" y1="507" x2="1040" y2="622"/>
    <line x1="1630" y1="504" x2="1630" y2="622"/>
  </g>
  <g font-size="12" fill="#1F1D1A" text-anchor="middle">
    <circle cx="290" cy="636" r="11" fill="none" stroke="#1F1D1A" stroke-width="1"/><text x="290" y="640">X3</text>
    <circle cx="1040" cy="636" r="11" fill="none" stroke="#1F1D1A" stroke-width="1"/><text x="1040" y="640">X2</text>
    <circle cx="1630" cy="636" r="11" fill="none" stroke="#1F1D1A" stroke-width="1"/><text x="1630" y="640">X1</text>
  </g>
  <g stroke="#6B6660" stroke-width="0.8">
    <line x1="290" y1="612" x2="1040" y2="612"/><line x1="1040" y1="612" x2="1630" y2="612"/>
  </g>
  <g font-size="11.5" fill="#2A2A2A" text-anchor="middle">
    <text x="665" y="608">7,500（店舗スパン）</text>
    <text x="1335" y="608">5,900（ラウンジ）</text>
  </g>
</svg>
